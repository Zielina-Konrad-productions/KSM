# ---------------------------------------------------------------------------
# Kastiusz System Manager Configuration
# Location after install: /opt/KSM/kastiusz.conf
# ---------------------------------------------------------------------------

[UI-khome]
# Default page shown by khome when no page option is passed.
# Exactly one default page should normally be true, unless show-all is true.

# PAGE 1 - KSM overview and configuration information
khome-default-page-1=true

# Show all khome pages at once.
# If true, default page options are ignored.
khome-show-all-pages=false
